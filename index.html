<!DECTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer-Based Planning Poker</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>

  <!-- ==============================================
     SCREEN 1 - Room Setup
  ============================================== -->
  <section id="screen-setup" class="screen active">
    <div class="card setup-card">
      <h1>ðŸƒ¿ Planning Poker</h1>
      <p class="subtitle">Timer-based story-point estimation</p>

      <label for="input-name">Your Name</label>
      <input id="input-name" type="text" placeholder="e.g. Alice" maxlength="30" />

      <label for="input-room">Room Name</label>
      <input id="input-room" type="text" placeholder="e.g. Sprint-42" maxlength="30" />

      <label for="input-timer">Timer Duration (seconds)</label>
      <input id="input-timer" type="number" min="10" max="300" value="60" />

      <button id="btn-join" class="btn btn-primary">Join / Create Room</button>
    </div>
  </section>

  <!-- ==============================================
     SCREEN 2 - Voting
  ============================================== -->
  <section id="screen-voting" class="screen">

    <!-- Header bar -->
    <header class="voting-header">
      <div class="room-info">
        <span id="display-room"></span>
        <span class="separator">&#8213;</span>
        <span id="display-name"></span>
      </div>

      <!-- Countdown timer ring -->
      <div class="timer-wrapper">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg"   cx="60" cy="60" r="54" />
          <circle class="ring-fill" cx="60" cy="60" r="54" id="ring-fill" />
        </svg>
        <span id="display-countdown" class="timer-label">60</span>
      </div>

      <div class="header-actions">
        <button id="btn-pause"  class="btn btn-sm btn-outline">Pause</button>
        <button id="btn-reveal" class="btn btn-sm btn-primary">Reveal Votes</button>
      </div>
    </header>

    <!-- Story label -->
    <div class="story-bar">
      <label for="input-story">Story / Ticket</label>
      <input id="input-story" type="text" placeholder="e.g. AUTH-101 - OAuth login" />
    </div>

    <!-- Poker cards -->
    <div class="cards-grid" id="cards-grid">
      <!-- Cards injected by app.js -->
    </div>

    <!-- Participants panel -->
    <div class="participants-panel">
      <h3>Participants</h3>
      <ul id="participants-list"></ul>
    </div>

  </section>

  <!-- ==============================================
     SCREEN 3 - Results
  ============================================== -->
  <section id="screen-results" class="screen">
    <div class="card results-card">
      <h2>ÐŸ“‡ Results</h2>
      <p id="results-story" class="results-story-label"></p>

      <div class="stats-row">
        <div class="stat"><span class="stat-label">Average</span><span id="stat-avg" class="stat-value">-</span></div>
        <div class="stat"><span class="stat-label">Min</span>    <span id="stat-min" class="stat-value">-</span></div>
        <div class="stat"><span class="stat-label">Max</span>    <span id="stat-max" class="stat-value">-</span></div>
      </div>

      <ul id="results-list" class="results-list"></ul>

      <div class="results-actions">
        <button id="btn-new-round" class="btn btn-primary">New Round</button>
        <button id="btn-leave"     class="btn btn-outline">Leave Room</button>
      </div>
    </div>
  </section>

  <script src="src/timer.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
