<!DOCTYPE html>
<!--
  Timer-Based Planning Poker
  Issue #7 | relentlesslearner222/planning-poker
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚣️ Timer-Based Planning Poker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>🃏 Planning Poker</h1>
    <p class="subtitle">Vote on story points — timer reveals all!</p>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- Setup Panel -->
    <section class="panel setup-panel" id="setupPanel">
      <h2>Session Setup</h2>

      <div class="form-group">
        <label for="storyInput">💋 Story / Task Description</label>
        <input type="text" id="storyInput" placeholder="e.g. Implement user authentication" />
      </div>

      <div class="form-group">
        <label for="participantInput">👤 Add Participant</label>
        <div class="inline-group">
          <input type="text" id="participantInput" placeholder="Participant name" />
          <button id="addParticipantBtn" class="btn btn-secondary">Add</button>
        </div>
      </div>

      <ul class="participant-list" id="participantList"></ul>

      <div class="form-group">
        <label for="timerDuration">♪ﻏ Timer Duration (seconds)</label>
        <input type="number" id="timerDuration" value="60" min="10" max="300" />
      </div>

      <button id="startSessionBtn" class="btn btn-primary">▸️ Start Session</button>
    </section>

    <!-- Voting Panel -->
    <section class="panel voting-panel hidden" id="votingPanel">
      <div class="story-title" id="storyTitle"></div>

      <div class="timer-section">
        <div class="timer-ring">
          <svg class="timer-svg" viewBox="0 0 120 120">
            <circle class="timer-bg" cx="60" cy="60" r="54" />
            <circle class="timer-progress" id="timerCircle" cx="60" cy="60" r="54" />
          </svg>
          <div class="timer-text" id="timerDisplay">60</div>
        </div>
        <div class="timer-controls">
          <button id="pauseResumeBtn" class="btn btn-secondary">ⅶ️ Pause</button>
          <button id="resetTimerBtn"  class="btn btn-secondary">👄 Reset</button>
          <button id="revealNowBtn"   class="btn btn-danger">👋 Reveal Now</button>
        </div>
      </div>

      <div class="cards-section">
        <h3 id="votingLabel">Cast your vote</h3>
        <p class="voter-select-hint">Select your name, then pick a card.</p>
        <div class="voter-selector" id="voterSelector"></div>
        <div class="card-deck" id="cardDeck"></div>
      </div>

      <div class="vote-status-section">
        <h3>Participants</h3>
        <ul class="vote-status-list" id="voteStatusList"></ul>
      </div>
    </section>

    <!-- Results Panel -->
    <section class="panel results-panel hidden" id="resultsPanel">
      <h2>📋 Results</h2>
      <div class="story-title" id="resultStoryTitle"></div>
      <ul class="results-list" id="resultsList"></ul>
      <div class="stats" id="statsBox"></div>
      <div class="results-actions">
        <button id="newRoundBtn"   class="btn btn-primary">🔁 New Round (same story)</button>
        <button id="newStoryBtn"   class="btn btn-secondary">💋 New Story</button>
        <button id="resetAllBtn"   class="btn btn-danger">🗐 Reset All</button>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Timer-Based Planning Poker &mdash; Issue #7</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
